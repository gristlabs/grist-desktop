name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: macos-14
    name: Undo diagnosis (macos-14, arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-14
          RUN_ARCH: arm64

      - name: Build
        run: yarn run build

      - name: Add undo logging
        run: git -C core apply --verbose ../probe/diagnose-undo.patch

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Run the deployment suite, logging every undo
        timeout-minutes: 180
        run: |
          mkdir -p probe-logs
          fail=0
          for i in 1 2 3 4; do
            yarn run test:electron:deployment > probe-logs/run-$i.txt 2>&1 || fail=$((fail+1))
            echo "--- iteration $i: $(grep -cE '^  [0-9]+\) ' probe-logs/run-$i.txt) failure block(s)"
          done
          echo "TOTAL: $fail of 4 iterations failed"

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undo-diagnosis
          path: probe-logs/
