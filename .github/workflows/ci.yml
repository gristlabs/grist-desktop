name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arm: [patched, baseline]
    name: ReferenceList ${{ matrix.arm }} (ubuntu)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Before the build: the patch changes client code, which the browser bundle has to carry.
      - name: Apply the fixes under test
        if: matrix.arm == 'patched'
        run: git -C core apply --verbose ../probe/fixes.patch

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ubuntu-22.04
          RUN_ARCH: x64
      - name: Build
        run: yarn run build
      - name: Build core browser tests
        run: yarn run build:tests

      # ReferenceList runs last of fifteen suites, and only fails there. Running it alone restarts
      # everything each round, which is the opposite of the state it fails in. A tail of suites in
      # one invocation keeps the app, the browser and the accumulated documents alive across it.
      - name: Loop the tail of the suite
        timeout-minutes: 150
        run: |
          mkdir -p probe-logs
          fail=0
          for i in $(seq 1 8); do
            yarn run test:electron:deployment ChoiceList Pages RowMenu ToggleColumns \
              ReferenceColumns ReferenceList > probe-logs/run-$i.txt 2>&1 || fail=$((fail+1))
            echo "run $i: $(grep -cE '^  [0-9]+\) ' probe-logs/run-$i.txt) failure block(s); $(
              grep -oE '[0-9]+ (passing|failing)' probe-logs/run-$i.txt | paste -sd' ' -)"
          done
          echo "TOTAL ${{ matrix.arm }}: $fail of 8 runs failed"

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflist-${{ matrix.arm }}
          path: probe-logs/
