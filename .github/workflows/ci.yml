name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: macos-14
    name: Pages race probe (macos-14, arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-14
          RUN_ARCH: arm64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Loop the Pages suite in deployment mode, before the fix
        timeout-minutes: 60
        run: |
          fail=0
          for i in $(seq 1 10); do
            yarn run test:electron:deployment Pages || fail=$((fail+1))
          done
          echo "CONTROL: $fail of 10 failed"

      - name: Apply the fix
        run: |
          git -C core apply --verbose ../probe/fix-races.patch
          yarn run build:tests

      - name: Loop the Pages suite in deployment mode, after the fix
        timeout-minutes: 60
        run: |
          fail=0
          for i in $(seq 1 10); do
            yarn run test:electron:deployment Pages || fail=$((fail+1))
          done
          echo "FIXED: $fail of 10 failed"
