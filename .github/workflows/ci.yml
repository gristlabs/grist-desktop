name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-2022
        host:
          - x64
        target:
          - x64
        node:
          - 22
        include:
          - os: macos-14
            host: arm64
            target: arm64
            node: 22
    name: ${{ matrix.os }} (node=${{ matrix.node }}, host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      # yarn run test starts with a .sh script, which cmd cannot run unaided.
      - name: Set up bash association
        if: startsWith(matrix.os, 'windows')
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Match the Packaging workflow, which skips optional dependencies
        # because they add msgextract which fails on windows. Installing them
        # here would hide packaging-only build failures.
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Check version consistency
        if: startsWith(matrix.os, 'ubuntu')
        run: node ./scripts/check-metainfo-version-matches.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ${{ matrix.os }}
          RUN_ARCH: ${{ matrix.target }}

      - name: Build
        run: yarn run build

      - name: Test
        timeout-minutes: 20
        run: yarn run test

      - name: Build core browser tests
        id: build_tests
        run: yarn run build:tests

      - name: Run core browser tests against the desktop app
        timeout-minutes: 30
        run: yarn run test:electron:upstream

      # The two modes test different things and fail for different reasons, so
      # one flaking should not cost us the other's result -- on windows it
      # already has, for a whole cycle. Run this whenever there is something to
      # run it against, and let the job fail on whichever step failed.
      - name: Run core browser tests against the desktop app as a server
        if: always() && steps.build_tests.outcome == 'success'
        timeout-minutes: 30
        run: yarn run test:electron:deployment

      # The failures worth understanding here are server-side, and the browser
      # log alone does not explain them.
      - name: Save the server log from the deployment tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-log-${{ matrix.os }}-${{ matrix.target }}
          path: test-logs/
          if-no-files-found: ignore
