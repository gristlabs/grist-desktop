name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: macos-14
    name: Mac flake diagnosis (macos-14, arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-14
          RUN_ARCH: arm64

      - name: Build
        run: yarn run build

      - name: Apply the fix under test, and the logging
        run: git -C core apply --verbose ../probe/mac-flakes.patch

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Loop the three suites, idle then loaded
        timeout-minutes: 180
        run: |
          mkdir -p probe-logs
          run_once() {
            yarn run test:electron:deployment Pages ToggleColumns RowMenu > "probe-logs/$1.txt" 2>&1 \
              && echo "$1: pass" || echo "$1: FAIL"
            grep -hE "^  [0-9]+\) |PROBE" "probe-logs/$1.txt" | head -20 || true
          }
          for i in 1 2 3 4; do run_once "idle-$i"; done
          # Two spinners on a three-core runner, to compress the timing the way a
          # busy runner does. Every failure so far has come from a loaded machine.
          for i in 1 2; do (while :; do :; done) & echo $! >> probe-logs/spinners; done
          for i in 1 2 3 4; do run_once "loaded-$i"; done
          kill $(cat probe-logs/spinners) || true

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-flake-diagnosis
          path: probe-logs/
