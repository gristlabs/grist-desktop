name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: macos-14
    name: Mac flake diagnosis (macos-14, arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-14
          RUN_ARCH: arm64

      - name: Build
        run: yarn run build

      - name: Apply the fix under test, and the logging
        run: git -C core apply --verbose ../probe/mac-flakes.patch

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Loop the three suites, idle then loaded
        timeout-minutes: 180
        run: |
          mkdir -p probe-logs
          run_once() {
            yarn run test:electron:deployment Pages ToggleColumns RowMenu > "probe-logs/$1.txt" 2>&1 \
              && echo "$1: pass" || echo "$1: FAIL"
            grep -hE "^  [0-9]+\) |PROBE" "probe-logs/$1.txt" | head -20 || true
          }
          # Load made no difference last time, so spend the budget on iterations instead.
          # The stale grid read showed up once in eight; twelve should say whether the fix
          # carried in this patch stops it, and give the other two more chances to appear.
          for i in $(seq 1 12); do run_once "run-$i"; done

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-flake-diagnosis
          path: probe-logs/
