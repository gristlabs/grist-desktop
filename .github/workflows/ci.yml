name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Driver start timing (ubuntu)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional
      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ubuntu-22.04
          RUN_ARCH: x64
      - name: Build
        run: yarn run build
      - name: Build core browser tests
        run: yarn run build:tests

      - name: Sample how long the browser takes to start
        timeout-minutes: 90
        run: |
          mkdir -p probe-logs
          for i in $(seq 1 40); do
            yarn run test:electron:deployment RowMenu > probe-logs/run-$i.txt 2>&1 || true
            grep -h DRIVERSTART probe-logs/run-$i.txt || echo "run $i: no timing line"
          done
          echo "--- slowest five"
          grep -ho "DRIVERSTART ok in [0-9]*ms" probe-logs/*.txt | grep -o "[0-9]*" | sort -n | tail -5
          echo "--- failures"
          grep -h "DRIVERSTART failed" probe-logs/*.txt || echo none

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-start
          path: probe-logs/
