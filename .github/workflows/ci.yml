name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Pages collapse validation (ubuntu)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Before the build: the patch changes client code, which the browser bundle has to carry.
      - name: Apply the fixes under test
        run: git -C core apply --verbose ../probe/fixes.patch

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ubuntu-22.04
          RUN_ARCH: x64
      - name: Build
        run: yarn run build
      - name: Build core browser tests
        run: yarn run build:tests

      - name: Check the bundle carries the hooks the tests wait on
        run: |
          for hook in $(grep -ho "testNumPending[A-Za-z]*" core/_build/test/nbrowser/*.js | sort -u); do
            grep -qr "$hook" core/static/*.js core/_build/app/client 2>/dev/null \
              || { echo "MISSING from the client build: $hook"; exit 1; }
            echo "ok: $hook"
          done

      - name: Loop the Pages suite
        timeout-minutes: 150
        run: |
          mkdir -p probe-logs
          fail=0
          for i in $(seq 1 14); do
            yarn run test:electron:deployment Pages > probe-logs/run-$i.txt 2>&1 || fail=$((fail+1))
            echo "run $i: $(grep -cE '^  [0-9]+\) ' probe-logs/run-$i.txt) failure block(s)"
          done
          echo "TOTAL: $fail of 14 runs failed"

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-collapse
          path: probe-logs/
