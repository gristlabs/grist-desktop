name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: macos-14
    name: Mac fix validation (macos-14, arm64)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-14
          RUN_ARCH: arm64

      # Before the build: the patch changes client code, and the browser bundle has to carry it.
      - name: Apply the fixes under test
        run: git -C core apply --verbose ../probe/mac-flakes.patch

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # Cheap guard, because the two ways this probe has been wasted were both a client bundle
      # built without a hook the compiled tests call. Seconds here beats a loop that dies on
      # every round for a reason that has nothing to do with what is being measured.
      - name: Check the bundle carries the hooks the tests wait on
        run: |
          for hook in $(grep -ho "testNumPending[A-Za-z]*" core/_build/test/nbrowser/*.js | sort -u); do
            grep -qr "$hook" core/static/*.js core/_build/app/client 2>/dev/null \
              || { echo "MISSING from the client build: $hook"; exit 1; }
            echo "ok: $hook"
          done

      - name: Loop the three suites, idle then loaded
        timeout-minutes: 180
        run: |
          mkdir -p probe-logs
          run_once() {
            yarn run test:electron:deployment Pages ToggleColumns RowMenu > "probe-logs/$1.txt" 2>&1 \
              && echo "$1: pass" || echo "$1: FAIL"
            grep -hE "^  [0-9]+\) |PROBE" "probe-logs/$1.txt" | head -20 || true
          }
          # Baselines to beat, from the last two runs of this same loop: ToggleColumns failed
          # 4 of 12 and RowMenu 1 of 12, both with no fix in place.
          for i in $(seq 1 12); do run_once "run-$i"; done

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-flake-diagnosis
          path: probe-logs/
