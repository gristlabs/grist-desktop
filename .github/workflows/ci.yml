name: CI
on:
  workflow_dispatch:
env:
  FORCE_COLOR: 1
  GRIST_SKIP_EXT_AUTOSETUP: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    name: ChoiceList flake diagnosis (ubuntu)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ubuntu-22.04
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Add the logging
        run: git -C core apply --verbose ../probe/diagnostics.patch

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Loop ChoiceList, as the app's own window
        timeout-minutes: 120
        run: |
          mkdir -p probe-logs
          fail=0
          for i in $(seq 1 12); do
            yarn run test:electron:upstream ChoiceList > probe-logs/run-$i.txt 2>&1 || fail=$((fail+1))
            echo "run $i: $(grep -cE '^  [0-9]+\) ' probe-logs/run-$i.txt) failure block(s)"
            grep -E "ENTERCELLPROBE" probe-logs/run-$i.txt || true
          done
          echo "TOTAL: $fail of 12 runs failed"

      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choicelist-diagnosis
          path: probe-logs/
