# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Must happen before the build: core is compiled from source.
      - name: Patch core logging to a readable file
        shell: bash
        run: node ./scripts/probe-patch-log.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # D: delay sweep plus a non-ACL action, default sandbox (unsandboxed).
      - name: D - delay sweep, unsandboxed
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-unsandboxed.log
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "D_EXIT=$?"

      # E: same sweep under pyodide. If a hanging shutdown item is the
      # unsandboxed python child, this should behave differently.
      - name: E - delay sweep, pyodide
        if: always()
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-pyodide.log
          GRIST_SANDBOX_FLAVOR: pyodide
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "E_EXIT=$?"

      - name: Server log - unsandboxed
        if: always()
        shell: bash
        run: |
          set +e
          wc -c server-unsandboxed.log
          grep -nE "apply|shutdown|Shutdown|ActiveDoc|NSandbox|closing|Closing|timeout|error" \
            server-unsandboxed.log | tail -120

      - name: Server log - pyodide
        if: always()
        shell: bash
        run: |
          set +e
          wc -c server-pyodide.log
          grep -nE "apply|shutdown|Shutdown|ActiveDoc|NSandbox|closing|Closing|timeout|error" \
            server-pyodide.log | tail -120

      - name: Keep the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-server-logs
          path: server-*.log
          if-no-files-found: warn
