# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Must happen before the build: core is compiled from source.
      - name: Patch core logging to a readable file
        shell: bash
        run: node ./scripts/probe-patch-log.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # G: instrument the socket, default agent. 10 reps to hit the ~20% race.
      - name: G - socket lifecycle, default agent
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_HTTP: 'true'
          GRIST_LOG_FILE: server-default-agent.log
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "G_EXIT=$?"

      # H: same, but with an agent that has no keepAlive and no timeout.
      - name: H - socket lifecycle, fresh agent
        if: always()
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_HTTP: 'true'
          GRIST_LOG_FILE: server-fresh-agent.log
          PROBE_AGENT: nokeepalive
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "H_EXIT=$?"

      - name: Tallies
        if: always()
        shell: bash
        run: |
          set +e
          echo "== connection-level events the server noticed =="
          grep -hE "aborted|ECONNRESET|EPIPE|socket|Client websocket closed" server-*.log | tail -30

      - name: Did the server ever write a response?
        if: always()
        shell: bash
        run: |
          set +e
          for f in server-default-agent.log server-fresh-agent.log; do
            echo "===== $f ====="
            grep -E "POST /o/docs/api/docs/[^ ]+/apply" "$f" | tail -20
          done

      - name: Keep the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-server-logs
          path: server-*.log
          if-no-files-found: warn
