# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Versions
        shell: bash
        run: |
          node -p "'node ' + process.version"
          node -p "'electron ' + require('electron/package.json').version"
          node -p "'chromedriver ' + require('chromedriver/package.json').version"

      # A: is the browser involved at all? Minimal API-only repro.
      - name: A - minimal API repro
        shell: bash
        env:
          KEEP_TMPDIR: '1'
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_HTTP: 'true'
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "A_EXIT=$?"

      # B: baseline, ActionLog alone with the server talking.
      - name: B - ActionLog alone, verbose
        if: always()
        shell: bash
        env:
          KEEP_TMPDIR: '1'
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_HTTP: 'true'
        run: |
          set +e
          node ./scripts/test-electron.js --upstream ActionLog
          echo "B_EXIT=$?"

      # C: is it about being the first suite? Run something else ahead of it.
      - name: C - LeftPanel then ActionLog
        if: always()
        shell: bash
        env:
          KEEP_TMPDIR: '1'
        run: |
          set +e
          node ./scripts/test-electron.js --upstream LeftPanel ActionLog
          echo "C_EXIT=$?"

      # Whatever the app itself said. Ordered oldest first, so A, B, C.
      - name: Dump app logs
        if: always()
        shell: bash
        run: |
          cat > dump-logs.js <<'EOF'
          const fs = require('fs'), os = require('os'), path = require('path');
          const tmp = os.tmpdir();
          const dirs = fs.readdirSync(tmp)
            .filter(d => d.startsWith('grist-desktop-test-'))
            .map(d => path.join(tmp, d))
            .sort((a, b) => fs.statSync(a).mtimeMs - fs.statSync(b).mtimeMs);
          console.log(`found ${dirs.length} temp dirs`);
          for (const d of dirs) {
            console.log('=========== ' + d + ' ===========');
            for (const name of fs.readdirSync(d)) { console.log('  entry: ' + name); }
            const f = path.join(d, 'chromedriver.log');
            try {
              const s = fs.readFileSync(f, 'utf8');
              console.log(`--- chromedriver.log (${s.length} bytes) ---`);
              console.log(s.length > 300000 ? s.slice(-300000) : s);
            } catch (e) {
              console.log('no chromedriver.log: ' + e.message);
            }
          }
          EOF
          node dump-logs.js
