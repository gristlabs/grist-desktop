# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Must happen before the build: core is compiled from source.
      - name: Patch core logging to a readable file
        shell: bash
        run: node ./scripts/probe-patch-log.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # D: rates for sync vs nosync vs plain, default sandbox (unsandboxed).
      - name: D - repeated cases, unsandboxed
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-unsandboxed.log
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "D_EXIT=$?"

      # E: same again under pyodide. If a hanging shutdown item is the
      # unsandboxed python child, the rates should move.
      - name: E - repeated cases, pyodide
        if: always()
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-pyodide.log
          GRIST_SANDBOX_FLAVOR: pyodide
        run: |
          set +e
          node ./scripts/test-electron.js --upstream AclProbe
          echo "E_EXIT=$?"

      # F: is "ActionLog alone passes" real, or was one green run luck?
      - name: F - ActionLog alone, three times
        if: always()
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-actionlog.log
        run: |
          set +e
          for i in 1 2 3; do
            node ./scripts/test-electron.js --upstream ActionLog 2>&1 | tail -30
            echo "F${i}_EXIT=${PIPESTATUS[0]}"
          done

      - name: Tallies
        if: always()
        shell: bash
        run: |
          set +e
          echo "== shutdown items that timed out =="
          grep -hE "timed out|shutdown starting|Doc being closed" server-*.log | sort | uniq -c | sort -rn | head -30

      - name: Server log around failures - unsandboxed
        if: always()
        shell: bash
        run: |
          set +e
          wc -c server-unsandboxed.log
          grep -nE "shutdown|Shutdown|timed out|applyUserActions|interrupt|muted|NSandbox" \
            server-unsandboxed.log | tail -100

      - name: Server log around failures - pyodide
        if: always()
        shell: bash
        run: |
          set +e
          wc -c server-pyodide.log
          grep -nE "shutdown|Shutdown|timed out|applyUserActions|interrupt|muted|NSandbox" \
            server-pyodide.log | tail -100

      - name: Keep the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-server-logs
          path: server-*.log
          if-no-files-found: warn
