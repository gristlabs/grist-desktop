# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
#
# Does scripts/test-deployment.sh work off linux, and does it catch the pyodide
# failure we found on windows? A pass on windows would mean that diagnosis is
# wrong. macos we have never checked at all.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  deployment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # The script is a .sh, which cmd cannot run unaided.
      - name: Set up bash association
        if: startsWith(matrix.os, 'windows')
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: ${{ matrix.os }}
          RUN_ARCH: ${{ matrix.arch }}

      - name: Candidate fix for pyodide path handling
        shell: bash
        run: node ./scripts/probe-patch-pyodide.js

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # One suite is enough to show whether the sandbox works.
      - name: Deployment tests
        shell: bash
        env:
          MOCHA_WEBDRIVER_HEADLESS: '1'
        run: |
          set +e
          yarn run test:electron:deployment ChoiceList
          echo "DEPLOY_EXIT=$?"

      # For contrast: the existing mode, which forces unsandboxed. If this
      # passes on windows while the above fails, the difference is the sandbox.
      - name: Upstream tests, for contrast
        if: always()
        shell: bash
        run: |
          set +e
          yarn run test:electron:upstream ChoiceList
          echo "UPSTREAM_EXIT=$?"

  # The question that actually matters: can the build we published open a
  # document and compute a formula? Everything else has been source checkouts.
  shipped:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      # Only the tests are built here. The app under test is the published one.
      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Fetch the published build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.14 --repo ${{ github.repository }} -p '*win-x64.zip' -D dl

      - name: Unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem dl -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dl/app -Force
          Get-ChildItem dl/app -Filter *.exe -Recurse -Depth 2 | Select-Object -First 5 FullName

      # Same fix, applied to the release we published, to see if it would cure it.
      - name: Candidate fix, inside the unpacked release
        shell: bash
        run: |
          set +e
          p=$(find dl/app -path '*pyodide/pipe.js' | head -1)
          echo "patching: $p"
          node ./scripts/probe-patch-pyodide.js "$p"
          echo "PATCH_EXIT=$?"

      - name: Can the published build open a document?
        shell: bash
        env:
          MOCHA_WEBDRIVER_HEADLESS: '1'
        run: |
          set +e
          exe=$(find dl/app -maxdepth 2 -iname '*.exe' | head -1)
          echo "exe: $exe"
          GRIST_DESKTOP_BIN="$(pwd)/$exe" yarn run test:electron:deployment ChoiceList
          echo "SHIPPED_EXIT=$?"
