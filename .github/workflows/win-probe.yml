# PROBE ONLY - not for merge. Self-triggering so it runs without being on the
# default branch.
name: Windows ActionLog probe
on:
  push:
    branches:
      - windows-actionlog-probe

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Set up bash association
        run: |
          cmd /c assoc .sh=bashscript
          cmd /c ftype bashscript="%ProgramFiles%\Git\bin\bash.exe" "%1"

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      # Must happen before the build: core is compiled from source.
      - name: Patch core for probing
        shell: bash
        run: |
          node ./scripts/probe-patch-log.js
          node ./scripts/probe-patch-pyodide.js

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: windows-2022
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: What is actually on disk
        shell: bash
        run: |
          set +e
          ls -la core/sandbox/pyodide/_build/packages/ | head -8
          echo "wheel count: $(ls core/sandbox/pyodide/_build/packages/*.whl | wc -l)"
          ls core/sandbox/pyodide/_build/packages/ | grep -i sorted

      # Does pyodide load its wheels from windows paths?
      - name: P - pyodide, both path forms
        if: always()
        shell: bash
        env:
          GRIST_LOG_LEVEL: debug
          GRIST_LOG_FILE: server-pyodide.log
          GRIST_SANDBOX_FLAVOR: pyodide
        run: |
          set +e
          node ./scripts/test-electron.js --upstream LeftPanel
          echo "P_EXIT=$?"

      - name: What pipe.js reported
        if: always()
        shell: bash
        run: |
          set +e
          grep -oE "\[probe\][^\"]{0,150}" server-pyodide.log | sort -u
          echo "-- package errors --"
          grep -oE "\[package-error\][^\"]{0,150}" server-pyodide.log | sort -u | head -10
          echo "-- module errors --"
          grep -oE "ModuleNotFoundError[^\"]{0,80}" server-pyodide.log | sort -u | head -5

      - name: Keep the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-server-logs
          path: server-*.log
          if-no-files-found: warn
