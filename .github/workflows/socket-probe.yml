# Throwaway diagnostic, not part of CI. Delete with test/probes/socket-idle.js.
#
# Deployment mode's ActionLog failure is a socket closed almost exactly five
# seconds into a request the server then answers successfully, on macos-15-intel
# and nowhere else. Nothing reproduces it locally. This asks the narrowest version
# of the question the runners can answer: does an idle HTTP request survive five
# seconds on each of them, with neither Grist nor Electron in the picture.
#
# Runs on push to its own branch and never merges, so it costs the main workflow
# nothing. Deliberately does not install dependencies or build: node's own http
# client is what node-fetch drives underneath, and keeping the job to a checkout
# and a script means a result in about two minutes.
name: Socket probe
on:
  push:
    branches:
      - socket-probe
  workflow_dispatch:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-14
          - ubuntu-22.04
          - windows-2022
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the failing job runs, since the client is node's.
          node-version: 22

      - name: Probe
        run: node ./test/probes/socket-idle.js

  # Phase two. Phase one cleared the platform: a plain idle request survives well
  # past five seconds on every runner. So trace the real one. Only ActionLog, only
  # the runner that shows the failure, and only the first test matters -- the other
  # nine fail because that one poisons the document with an access rule it never
  # gets to remove.
  trace:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    name: deployment trace (macos-15-intel)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-15-intel
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Trace ActionLog in deployment mode
        timeout-minutes: 30
        env:
          GRIST_TEST_SOCKET_TRACE: '1'
        run: node ./scripts/test-electron.js --deployment ActionLog

      - name: Save the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-log
          path: test-logs/
          if-no-files-found: ignore

  # Phase three. Phase two named the mechanism: axios leaves a socket.destroy
  # listener on the 'timeout' event of every keep-alive socket it touches
  # (follow-redirects' setTimeout adds it, its clearTimer never removes it), and
  # node's global agent arms a five second idle timer on pooled sockets. A later
  # request that takes longer than that to answer is destroyed under itself.
  # test/probes/no-idle-timer.js disables the timer.
  #
  # A theory that only explains a failure is worth less than one that removes
  # it, so run the failing suite both ways and compare. Alternating the two arms
  # within one job, rather than running a job each, is deliberate: the first
  # attempt ran them as a matrix and the two arms disagreed in a way that could
  # equally have been the fix working or the two runners having built different
  # things. One machine, one build, alternating rounds answers that.
  #
  # The rounds do not fail the step: the tally is the result, and a step that
  # stopped at the first failure would only ever report the control arm's first
  # round. The app's own log is kept per round, because a round that fails
  # server-side leaves its only account there.
  fix:
    runs-on: macos-15-intel
    name: ActionLog with the idle timer alternating (macos-15-intel)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-15-intel
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # The trace runs in both arms. It costs nothing and it says which
      # mechanism was at work, so a round that fails for some other reason
      # cannot be mistaken for this one.
      - name: Run ActionLog six times, alternating
        timeout-minutes: 90
        env:
          GRIST_TEST_SOCKET_TRACE: '1'
        run: |
          pass_off=0; fail_off=0; pass_on=0; fail_on=0
          for round in 1 2 3 4 5 6; do
            if [ $((round % 2)) -eq 1 ]; then
              arm=off; unset GRIST_TEST_NO_IDLE_TIMER
            else
              arm=on; export GRIST_TEST_NO_IDLE_TIMER=1
            fi
            export GRIST_TEST_LOG_DIR="$PWD/test-logs/round-$round-$arm"
            echo "=== round $round (idle timer $arm) ==="
            if node ./scripts/test-electron.js --deployment ActionLog; then
              if [ "$arm" = off ]; then pass_off=$((pass_off + 1)); else pass_on=$((pass_on + 1)); fi
            else
              if [ "$arm" = off ]; then fail_off=$((fail_off + 1)); else fail_on=$((fail_on + 1)); fi
            fi
          done
          echo "idle timer off: $pass_off passed, $fail_off failed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "idle timer on:  $pass_on passed, $fail_on failed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the app logs from every round
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-logs
          path: test-logs/
          if-no-files-found: ignore
