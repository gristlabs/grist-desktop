# Throwaway diagnostic, not part of CI. Delete with test/probes/socket-idle.js.
#
# Deployment mode's ActionLog failure is a socket closed almost exactly five
# seconds into a request the server then answers successfully, on macos-15-intel
# and nowhere else. Nothing reproduces it locally. This asks the narrowest version
# of the question the runners can answer: does an idle HTTP request survive five
# seconds on each of them, with neither Grist nor Electron in the picture.
#
# Runs on push to its own branch and never merges, so it costs the main workflow
# nothing. Deliberately does not install dependencies or build: node's own http
# client is what node-fetch drives underneath, and keeping the job to a checkout
# and a script means a result in about two minutes.
name: Socket probe
on:
  push:
    branches:
      - socket-probe
  workflow_dispatch:

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-14
          - ubuntu-22.04
          - windows-2022
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the failing job runs, since the client is node's.
          node-version: 22

      - name: Probe
        run: node ./test/probes/socket-idle.js

  # Phase two. Phase one cleared the platform: a plain idle request survives well
  # past five seconds on every runner. So trace the real one. Only ActionLog, only
  # the runner that shows the failure, and only the first test matters -- the other
  # nine fail because that one poisons the document with an access rule it never
  # gets to remove.
  trace:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    name: deployment trace (macos-15-intel)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-15-intel
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      - name: Trace ActionLog in deployment mode
        timeout-minutes: 30
        env:
          GRIST_TEST_SOCKET_TRACE: '1'
        run: node ./scripts/test-electron.js --deployment ActionLog

      - name: Save the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-log
          path: test-logs/
          if-no-files-found: ignore

  # Phase three. Phase two named the mechanism: axios leaves a socket.destroy
  # listener on the 'timeout' event of every keep-alive socket it touches
  # (follow-redirects' setTimeout adds it, its clearTimer never removes it), and
  # node's global agent arms a five second idle timer on pooled sockets. A later
  # request that takes longer than that to answer is destroyed under itself.
  #
  # A theory that only explains a failure is worth less than one that removes
  # it, so run the failing suite against two cures and a control. The cures
  # disagree about what to blame: no-idle-timer.js keeps the leaked listener and
  # disarms the timer, unhook-timeout.js keeps the timer and removes the
  # listener. If the narrow one is enough, node's timer is exonerated and axios
  # is the whole story.
  #
  # The arms alternate within one job rather than running a job each. The first
  # attempt ran them as a matrix and they disagreed in a way that could equally
  # have been the fix working or the two runners having built different things.
  # One machine, one build, round-robin rounds answers that.
  #
  # The rounds do not fail the step: the tally is the result, and a step that
  # stopped at the first failure would only ever report the control's first
  # round. Every round leaves its own app log, and the digest pulls the few
  # lines worth reading out of each -- what the sandbox was asked to do, and
  # what it raised -- so the job log answers the question without anyone
  # downloading an artifact.
  fix:
    runs-on: macos-15-intel
    name: ActionLog against two cures and a control (macos-15-intel)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --network-timeout 300000 --ignore-optional

      - name: Hooks and crooks
        run: yarn run setup
        env:
          RUN_OS: macos-15-intel
          RUN_ARCH: x64

      - name: Build
        run: yarn run build

      - name: Build core browser tests
        run: yarn run build:tests

      # The trace runs in every arm. It costs nothing and it says which
      # mechanism was at work, so a round that fails for some other reason
      # cannot be mistaken for this one.
      - name: Run ActionLog against each arm three times
        id: arms
        timeout-minutes: 60
        env:
          GRIST_TEST_SOCKET_TRACE: '1'
        run: |
          digest() {
            log="$1/deployment-app.log"
            if [ ! -f "$log" ]; then echo "  digest: no app log"; return; fi
            echo "  what the sandbox was asked to do:"
            grep -o "funcName=[a-z_]*" "$log" | sort | uniq -c | sed "s/^/    /"
            echo "  what it raised:"
            grep -o "SandboxError: \[Sandbox\] [A-Za-z]*Error [^,]*" "$log" |
              sort -u | sed "s/^/    /" || true
            echo "  how the applies ended:"
            echo "    done: $(grep -c "applyUserActions done" "$log" || true)"
          }
          pass_off=0; pass_notimer=0; pass_unhook=0
          fail_off=0; fail_notimer=0; fail_unhook=0
          for round in 1 2 3 4 5 6 7 8 9; do
            unset GRIST_TEST_NO_IDLE_TIMER GRIST_TEST_UNHOOK_TIMEOUT
            case $((round % 3)) in
              1) arm=off ;;
              2) arm=notimer; export GRIST_TEST_NO_IDLE_TIMER=1 ;;
              0) arm=unhook; export GRIST_TEST_UNHOOK_TIMEOUT=1 ;;
            esac
            dir="$PWD/test-logs/round-$round-$arm"
            export GRIST_TEST_LOG_DIR="$dir"
            echo "=== round $round ($arm) ==="
            if node ./scripts/test-electron.js --deployment ActionLog; then
              ok=1
            else
              ok=0
            fi
            case $arm in
              off) [ $ok = 1 ] && pass_off=$((pass_off + 1)) || fail_off=$((fail_off + 1)) ;;
              notimer) [ $ok = 1 ] && pass_notimer=$((pass_notimer + 1)) || fail_notimer=$((fail_notimer + 1)) ;;
              unhook) [ $ok = 1 ] && pass_unhook=$((pass_unhook + 1)) || fail_unhook=$((fail_unhook + 1)) ;;
            esac
            echo "--- round $round ($arm) digest ---"
            digest "$dir"
          done
          {
            echo "control:            $pass_off passed, $fail_off failed"
            echo "idle timer off:     $pass_notimer passed, $fail_notimer failed"
            echo "listener unhooked:  $pass_unhook passed, $fail_unhook failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Whichever cure held up carries into the full-suite step. The narrow
          # one is preferred when both do: it leaves node's socket reaping alone.
          if [ $fail_unhook = 0 ]; then echo "winner=unhook" >> "$GITHUB_OUTPUT"
          elif [ $fail_notimer = 0 ]; then echo "winner=notimer" >> "$GITHUB_OUTPUT"
          else echo "winner=none" >> "$GITHUB_OUTPUT"; fi

      # One suite passing is not the question anyone is really asking. This is:
      # does the mac job go green. Skipped when neither cure held, since there
      # would be nothing to run it with.
      - name: Run the whole deployment set with the cure that held
        if: always() && (steps.arms.outputs.winner == 'unhook' || steps.arms.outputs.winner == 'notimer')
        timeout-minutes: 45
        env:
          GRIST_TEST_SOCKET_TRACE: '1'
          GRIST_TEST_NO_IDLE_TIMER: ${{ steps.arms.outputs.winner == 'notimer' && '1' || '' }}
          GRIST_TEST_UNHOOK_TIMEOUT: ${{ steps.arms.outputs.winner == 'unhook' && '1' || '' }}
          GRIST_TEST_LOG_DIR: ${{ github.workspace }}/test-logs/full-suite
        run: node ./scripts/test-electron.js --deployment

      - name: Save the app logs from every round
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-logs
          path: test-logs/
          if-no-files-found: ignore
